[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "spirit-computer-use"
version = "0.2.2"
description = "Your Chrome tabs, an independent browser cursor, and MCP agents"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "SPIRIT contributors"}]
dependencies = [
  "mcp>=1.30,<2",
  "pydantic>=2.11,<3",
  "Pillow>=11,<13",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "PyYAML>=6,<7", "tomli>=2,<3", "playwright==1.64.0"]

[project.scripts]
spirit = "spirit_computer_use.cli:main"

[project.urls]
Repository = "https://github.com/scarrymany/spirit-computer-use"

[tool.hatch.build.targets.wheel]
packages = ["src/spirit_computer_use"]

[tool.hatch.build.targets.wheel.force-include]
"extension" = "spirit_computer_use/extension"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: real Chromium extension and CDP integration"]
